AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DevOps AI Portfolio API

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 256

Resources:
  PortfolioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: devops-ai-portfolio
      Handler: app.lambda_handler
      CodeUri: .
      Architectures:
        - x86_64

      Events:
        Root:
          Type: Api
          Properties:
            Path: /
            Method: ANY

        Proxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  PortfolioApi:
    Description: API Gateway endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
